<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mein Daten-Digitalisierer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
/* VOICE: ruhig, sachlich, verlässlich – wie eine sauber geführte Akte.
   IDEA: ein Aktenordner mit Register: Alt (vor Stichtag) und Neu (danach).
   PICTURE: die Arbeitsfläche selbst – Akten als Karteikarten mit farbiger Registerkante.
   COLOUR and TYPE: Weiß/Nacht, Tinte, Karminrot = Alt-Forderung, Preußischblau = Neu; Literata.
   LAYOUT: eine ruhige Spalte, unten Navigation auf dem Handy, oben ab 900px. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1217);--ink:light-dark(#10131a,#e9ebf1);--mut:light-dark(#5a606e,#9ca3b4);--line:light-dark(#e2e4ea,#272c37);--card:light-dark(#f5f6f8,#171b23);--alt:light-dark(#c1121f,#ff6f78);--neu:light-dark(#0b4f8a,#7fb9ff);--warn:light-dark(#8a5a00,#f2c14e);--ok:light-dark(#1d7349,#63d49c);--field:light-dark(#ffffff,#11151c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Literata,Georgia,serif;overflow-x:clip}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(28px,6vw,40px)}h2{font-size:22px}h3{font-size:17px}
a{color:var(--neu)}
.wrap{max-width:860px;margin:0 auto;padding:20px max(4vw,14px) 110px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px max(4vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top b{font-size:18px}
.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:10px 4px 12px;min-height:56px}
.nav button[aria-current=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--ink)}
.nav .plus{color:var(--neu);font-weight:600}
@media(min-width:900px){.nav{position:sticky;top:57px;bottom:auto;max-width:860px;margin:0 auto;border:0;border-bottom:1px solid var(--line)}.wrap{padding-bottom:60px}}
button,.btn{font:inherit;font-size:15px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri,button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.red{background:var(--alt);border-color:var(--alt);color:#fff}
button.ghost{background:none}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--neu);outline-offset:2px}
button:disabled{opacity:.5}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);min-height:44px}
textarea{line-height:1.45;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{font-size:14px;color:var(--mut)}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.fig{border-radius:14px;padding:14px;background:var(--card);border-top:5px solid var(--mut)}
.fig.alt{border-color:var(--alt)}.fig.neu{border-color:var(--neu)}.fig.chk{border-color:var(--warn)}
.fig b{display:block;font-size:clamp(20px,5vw,30px);white-space:nowrap;line-height:1.2}
.fig span{font-size:13px;color:var(--mut)}
@media(max-width:520px){.figs{grid-template-columns:1fr}.fig{display:flex;justify-content:space-between;align-items:baseline;gap:10px}}
.akte{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:7px solid var(--mut);background:var(--bg);border-radius:12px;padding:12px 14px;margin:10px 0}
.k-alt{border-left-color:var(--alt)}.k-neu{border-left-color:var(--neu)}.k-q{border-left-color:var(--warn)}.k-gemischt{border-left-color:var(--alt);border-image:linear-gradient(var(--alt) 50%,var(--neu) 50%) 0 0 0 1}.k-verf{border-left-color:var(--ok)}
.akte .ln{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.akte strong{display:block;font-size:17px;margin:2px 0}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.b-alt{color:var(--alt);border-color:currentColor}.b-neu{color:var(--neu);border-color:currentColor}.b-q{color:var(--warn);border-color:currentColor}.b-verf{color:var(--ok);border-color:currentColor}.b-gemischt{color:var(--alt);border-color:currentColor}.b-teil{color:var(--warn);border-color:currentColor}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chips button{flex:none;min-height:38px;padding:6px 14px;border-radius:99px;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.chain span{background:var(--card);border-radius:8px;padding:4px 10px;font-size:14px}
.chain i{font-style:normal;color:var(--mut)}
.brief{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;opacity:.78}
.brief.newest{opacity:1;border:2px solid var(--ink);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.brief .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brief dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:8px 0;font-size:14px}
.brief dt{color:var(--mut)}.brief dd{margin:0}
.todo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:12px 0}
.todo div{flex:1 1 220px}
.todo small{display:block;color:var(--mut)}
.frist{color:var(--alt);font-weight:600}
.banner{border-left:5px solid var(--warn);background:var(--card);padding:12px 14px;border-radius:10px;margin:12px 0}
.lockbox{max-width:440px;margin:8vh auto;padding:0 18px}
.code{font-size:clamp(18px,5vw,24px);letter-spacing:.06em;background:var(--card);border:2px dashed var(--ink);border-radius:12px;padding:16px;text-align:center;word-break:break-all;font-weight:600}
.meter{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--alt);width:0;transition:width .2s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal>div{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(4vw,16px) 28px}
@media(min-width:720px){.modal{align-items:center}.modal>div{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:15px;max-width:90vw}
.split{height:10px;border-radius:9px;display:flex;overflow:hidden;background:var(--line);margin:6px 0}.split i{display:block}
.warnlist{margin:8px 0;padding-left:20px;font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs button{min-height:36px;font-size:13px;padding:4px 10px}
img.scan{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.fld input.auto,.fld select.auto,textarea.auto{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
input.miss{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.tag{font-size:12px;color:var(--ok);margin-left:6px;font-weight:600}
.vh{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:120px;border:2px dashed var(--neu);border-radius:14px;color:var(--ink);text-align:center;padding:16px;cursor:pointer;margin:0;background:var(--bg)}
.pick b{font-size:19px;color:var(--neu)}.pick span{font-size:14px;color:var(--mut)}
#pv img{height:84px;border-radius:6px;border:1px solid var(--line)}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:8px}.hd2 h3{margin:0}
details.card>summary{font-weight:600;cursor:pointer;min-height:32px;list-style-position:inside}
.savebar{position:sticky;bottom:64px;background:var(--bg);padding:10px 0;display:flex;gap:8px;z-index:4}
.savebar .pri{flex:1}
@media(min-width:900px){.savebar{bottom:0}}
.seg{display:flex;gap:0;margin:4px 0 6px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;min-height:40px;font-size:14px}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
details.grp{margin:14px 0 4px}details.grp>summary{cursor:pointer;font-size:17px;padding:6px 0;border-bottom:1px solid var(--line)}
button.pick{width:100%;font:inherit}
.ms{list-style:none;padding:0;margin:14px 0 6px}.ms li{padding:6px 0 6px 22px;position:relative;color:var(--mut)}.ms li::before{content:'';position:absolute;left:4px;top:13px;width:9px;height:9px;border-radius:50%;border:2px solid var(--mut)}.ms li.ok{color:var(--ink)}.ms li.ok::before{background:var(--ok);border-color:var(--ok)}
dl.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:8px 0}dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="lockbox"><h1>Mein Daten-Digitalisierer</h1><p class="note">Wird geladen …</p></div></div>
<div id="modal"></div>
<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const te=new TextEncoder(),td=new TextDecoder();
const b64=buf=>{const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const nid=()=>Array.from(rnd(12),x=>x.toString(16).padStart(2,'0')).join('');
const ITER=600000,CH=180000;
const ROLLEN={insogericht:'Insolvenzgericht',verwalter:'Insolvenzverwalter / Treuhänder',kanzlei:'Meine Kanzlei',gericht:'Anderes Gericht (Mahngericht usw.)',gv:'Gerichtsvollzieher',anwalt:'Anwalt des Gläubigers',inkasso:'Inkassobüro',glaeubiger:'Gläubiger (Firma)',behoerde:'Behörde / Amt',verfahren:'Eigenes Verfahren (sonstiges)',sonst:'Sonstige'};
const GRUPPEN=[['insogericht','Insolvenzgericht'],['verwalter','Insolvenzverwalter'],['kanzlei','Meine Kanzlei'],['verfahren','Eigenes Verfahren'],['gericht','Andere Gerichte'],['gv','Gerichtsvollzieher'],['anwalt','Anwälte der Gläubiger'],['inkasso','Inkassobüros'],['glaeubiger','Gläubiger / Firmen'],['behoerde','Behörden & Ämter'],['sonst','Sonstige']];
const VERF=new Set(['verfahren','insogericht','verwalter','kanzlei']);
const TYPEN={rechnung:'Rechnung',mahnung:'Mahnung / Zahlungsaufforderung',mahnbescheid:'Mahnbescheid',vb:'Vollstreckungsbescheid',pfaendung:'Pfändung / Vollstreckungsmaßnahme',klage:'Klage / Ladung / sonstiges Gerichtsschreiben',info:'Information / Sonstiges'};
const GT=new Set(['mahnbescheid','vb','pfaendung','klage']);
const KL={alt:'Alt-Forderung',neu:'Neu · selbst zahlen',gemischt:'Alt + Neu gemischt','?':'Prüfen',verf:'Eigenes Verfahren',teil:'Geteilt'};
const KC={alt:'alt',neu:'neu',gemischt:'gemischt','?':'q',verf:'verf',teil:'teil'};
const DEF={kind:'settings',stichtag:'2026-11-04',insoGericht:'',insoGerichtAdr:'',insoAz:'',verwalter:'',verwalterMail:'',verwalterAdr:'',kanzlei:'',kanzleiMail:'',name:'',adresse:'',lockMin:5};

let KEY=null,META=null,view={v:'home'},lastAct=Date.now(),hiddenAt=0,fails=0,blockUntil=0,filt='alle',query='';
const E=new Map();
const app=$('#app');

/* ---------- Krypto ---------- */
async function kdf(pw,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const aesKey=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function seal(key,bytes){const iv=rnd(12);const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return{iv:b64(iv),c:b64(c)}}
async function unseal(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.c)))}
const sealJ=o=>seal(KEY,te.encode(JSON.stringify(o)));
const unsealJ=async o=>JSON.parse(td.decode(await unseal(KEY,o)));
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from(rnd(25),x=>ALPH[x&31]).join('').match(/.{5}/g).join('-');
const normCode=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
function strength(p){let s=0;if(p.length>=12)s++;if(p.length>=16)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return s}

/* ---------- Speicher: Cloud (Supabase) oder nur dieses Gerät ---------- */
const AB=window.AndroidBridge||null;
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};
const Local={db:null,
 open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open('mein-daten-digitalisierer',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 req(mode,f){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('docs',mode),r=f(t.objectStore('docs'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)}))},
 get(c,id){return this.req('readonly',s=>s.get(c+'/'+id))},
 set(c,id,body){return this.req('readwrite',s=>s.put(body,c+'/'+id))},
 del(c,id){return this.req('readwrite',s=>s.delete(c+'/'+id))},
 list(c){return this.open().then(db=>new Promise((res,rej)=>{const out=[],t=db.transaction('docs','readonly'),rq=t.objectStore('docs').openCursor(IDBKeyRange.bound(c+'/',c+'/￿'));rq.onsuccess=()=>{const cu=rq.result;if(cu){out.push({id:cu.key.slice(c.length+1),...cu.value});cu.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)}))}};
const Cloud={url:'',key:'',at:'',exp:0,
 cfg(){this.url=(LS.get('sb_url')||'').trim().replace(/\/+$/,'');this.key=(LS.get('sb_key')||'').trim();return!!(this.url&&this.key)},
 async auth(body,grant){let r;try{r=await withT(fetch(`${this.url}/auth/v1/token?grant_type=${grant}`,{method:'POST',headers:{apikey:this.key,'Content-Type':'application/json'},body:JSON.stringify(body)}))}catch(e){throw new Error('Keine Verbindung zum Server')}
  const j=await r.json().catch(()=>({}));if(!r.ok){if(grant==='refresh_token')LS.del('sb_rt');throw Object.assign(new Error(r.status===400?'E-Mail oder Konto-Passwort falsch':(j.error_description||j.msg||'Anmeldung fehlgeschlagen')),{code:'auth'})}
  this.at=j.access_token;this.exp=Date.now()+((j.expires_in||3600)-60)*1000;LS.set('sb_rt',j.refresh_token);if(j.user?.email)LS.set('sb_email',j.user.email);return j},
 login(email,password){return this.auth({email,password},'password')},
 async token(){if(this.at&&Date.now()<this.exp)return this.at;const rt=LS.get('sb_rt');if(!rt)throw Object.assign(new Error('Nicht angemeldet'),{code:'auth'});await this.auth({refresh_token:rt},'refresh_token');return this.at},
 logout(){this.at='';this.exp=0;LS.del('sb_rt')},
 async rq(path,opt={},ms=30000){const t=await this.token();let r;try{r=await withT(fetch(`${this.url}/rest/v1/${path}`,{...opt,headers:{apikey:this.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})}}),ms)}catch(e){throw new Error(e.message.startsWith('Zeit')?e.message:'Keine Verbindung zum Server')}
  if(r.status===401){this.at='';throw Object.assign(new Error('Anmeldung abgelaufen'),{code:'auth'})}
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('Serverfehler '+r.status))}return r},
 async get(c,id){const a=await(await this.rq(`vault_docs?select=body&coll=eq.${c}&id=eq.${encodeURIComponent(id)}`)).json();return a[0]?.body},
 async set(c,id,body){await this.rq('vault_docs?on_conflict=user_id,coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({coll:c,id,body})},60000)},
 async del(c,id){await this.rq(`vault_docs?coll=eq.${c}&id=eq.${encodeURIComponent(id)}`,{method:'DELETE'})},
 async list(c){const out=[],step=c==='blobs'?15:500;for(let o=0;;o+=step){const a=await(await this.rq(`vault_docs?select=id,body&coll=eq.${c}&order=id&limit=${step}&offset=${o}`,{},60000)).json();for(const x of a)out.push({id:x.id,...(x.body||{})});if(a.length<step)break}return out}};
const mode=()=>LS.get('mode')||'';
const B=()=>mode()==='cloud'?Cloud:Local;
let chain=Promise.resolve();
const serial=f=>(chain=chain.then(f,f));
const withT=(p,ms=20000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('Zeitüberschreitung – keine Verbindung')),ms))]);
async function put(o){E.set(o.id,o);const body=await sealJ(o);await serial(()=>B().set('entries',o.id,body));remSync()}
async function del(id){E.delete(id);await serial(()=>B().del('entries',id));remSync()}
async function loadAll(){E.clear();const docs=await B().list('entries');for(const d of docs){const{id,...body}=d;try{const o=await unsealJ(body);o.id=id;E.set(id,o)}catch(e){console.warn('Eintrag nicht lesbar',id)}}if(!E.has('settings'))E.set('settings',{...DEF,id:'settings'});remSync()}
async function compress(file,m=1800,q=.72){const bmp=await createImageBitmap(file);const s=Math.min(1,m/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));return new Uint8Array(await blob.arrayBuffer())}
async function prep(file,forOcr=false){const name=file.name||'scan',type=file.type||'';
 if(type.startsWith('image/'))return{name,type:'image/jpeg',bytes:await compress(file),ocrBytes:forOcr?await compress(file,2800,.92):null};
 if(type==='application/pdf'||/\.pdf$/i.test(name)){if(file.size>8e6)throw new Error('PDF ist größer als 8 MB');return{name,type:'application/pdf',bytes:new Uint8Array(await file.arrayBuffer())}}
 throw new Error('Nur Fotos oder PDF-Dateien')}
async function storeFile(pf){const{iv,c}=await seal(KEY,pf.bytes);const fid=nid(),n=Math.ceil(c.length/CH);
 for(let i=0;i<n;i++){const body={c:c.slice(i*CH,(i+1)*CH)};await serial(()=>B().set('blobs',fid+'_'+i,body))}
 return{fid,name:pf.name,type:pf.type,n,iv,size:pf.bytes.length}}
async function loadFile(f){let c='';for(let i=0;i<f.n;i++){const d=await B().get('blobs',f.fid+'_'+i);if(!d)throw new Error('Datei unvollständig');c+=d.c}return unseal(KEY,{iv:f.iv,c})}
async function dropFile(f){for(let i=0;i<f.n;i++)await serial(()=>B().del('blobs',f.fid+'_'+i))}
/* Texterkennung direkt auf dem Handy (nur in der App) */
const ocrWait=new Map();window.__ocrDone=(id,t)=>{const f=ocrWait.get(id);if(f){ocrWait.delete(id);f(String(t||''))}};
const scanWait=new Map();window.__scanDone=(id,j)=>{const f=scanWait.get(id);if(f){scanWait.delete(id);f(j)}};

const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);

/* ---------- Modell ---------- */
const ST=()=>E.get('settings')||{...DEF,id:'settings'};
const normAz=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const dOf=b=>b.bdatum||b.rdatum||(b.created||'').slice(0,10);
const akteKey=b=>b.akte||(normAz(b.az)?'az:'+normAz(b.az):'id:'+b.id);
const isGer=b=>GT.has(b.typ)||b.rolle==='gericht'||b.rolle==='gv'||b.rolle==='insogericht';
function isVerf(b){const s=ST();return VERF.has(b.rolle)||(!!normAz(s.insoAz)&&normAz(b.az)===normAz(s.insoAz))}
function classB(b){const st=ST().stichtag;if(isVerf(b))return{k:'verf',why:'Schreiben aus dem eigenen Verfahren'};
 const von=b.lvon||b.lbis,bis=b.lbis||b.lvon;
 if(von){if(bis<st)return{k:'alt',why:'Leistung vor dem Stichtag'};if(von>=st)return{k:'neu',why:'Leistung ab dem Stichtag'};const tot=dd(von,bis)+1,a=dd(von,st);return{k:'teil',a:a/tot,why:`${a} von ${tot} Tagen liegen vor dem Stichtag`}}
 if(b.rdatum)return b.rdatum<st?{k:'alt',why:'Rechnungsdatum vor dem Stichtag'}:{k:'?',why:'Rechnung nach dem Stichtag, aber kein Leistungszeitraum – bitte prüfen'};
 if(b.bdatum&&b.bdatum<st)return{k:'alt',why:'Schreiben stammt von vor dem Stichtag'};
 return{k:'?',why:'kein Leistungs- oder Rechnungsdatum'}}
function amt(list){const w=list.filter(x=>x.b.betrag>0);if(!w.length)return 0;if(w[0].b.typ==='rechnung')return w.filter(x=>x.b.typ==='rechnung').reduce((s,x)=>s+x.b.betrag*(x.f??1),0);return w[0].b.betrag*(w[0].f??1)}
function akten(){const m=new Map(),all=[...E.values()];
 for(const b of all.filter(o=>o.kind==='brief')){const k=akteKey(b);if(!m.has(k))m.set(k,{key:k,briefe:[]});m.get(k).briefe.push(b)}
 for(const a of m.values()){
  a.briefe.sort((x,y)=>dOf(y).localeCompare(dOf(x))||(y.created||'').localeCompare(x.created||''));
  a.neuest=a.briefe[0];a.meta=all.find(o=>o.kind==='aktemeta'&&o.key===a.key)||null;
  a.pays=all.filter(o=>o.kind==='zahlung'&&o.key===a.key).sort((x,y)=>y.datum.localeCompare(x.datum));
  a.cls=a.briefe.map(b=>({b,c:classB(b)}));
  const ks=new Set(a.cls.map(x=>x.c.k).filter(k=>k!=='?'));
  let k;if(ks.has('verf'))k='verf';else if(!ks.size)k='?';else if(ks.size===1)k=[...ks][0]==='teil'?'gemischt':[...ks][0];else k='gemischt';
  a.auto=k;a.k=a.meta?.ov||k;
  for(const x of a.cls){if(x.c.k==='verf')continue;if(a.meta?.ov)x.c={k:a.meta.ov,why:'von dir manuell festgelegt'};else if(x.c.k==='?'&&(k==='alt'||k==='neu'))x.c={k,why:'über das Aktenzeichen der Akte zugeordnet'}}
  a.chain=[];for(const b of [...a.briefe].reverse())if(b.firma&&!a.chain.some(c=>c.firma===b.firma))a.chain.push({firma:b.firma,rolle:b.rolle,d:dOf(b)});
  a.glaeubiger=a.chain[0]?.firma||'Unbekannter Absender';a.aktuell=a.neuest.firma||'';
  a.az=(a.briefe.find(b=>b.az)||{}).az||'';
  const AL=[],NL=[];for(const x of a.cls){if(x.c.k==='alt')AL.push({b:x.b});else if(x.c.k==='neu')NL.push({b:x.b});else if(x.c.k==='teil'){AL.push({b:x.b,f:x.c.a});NL.push({b:x.b,f:1-x.c.a})}}
  a.alt=amt(AL);a.neu=amt(NL);a.paid=a.pays.reduce((s,p)=>s+p.betrag,0);a.offen=Math.max(0,a.neu-a.paid);
  a.ger=a.briefe.some(isGer);a.done=a.meta?.status==='erledigt';
  a.text=[a.glaeubiger,a.aktuell,a.az,...a.briefe.map(b=>`${b.az} ${b.firma} ${b.notiz||''}`)].join(' ').toLowerCase()}
 return[...m.values()].sort((x,y)=>dOf(y.neuest).localeCompare(dOf(x.neuest)))}
const fristOf=b=>(b.typ==='mahnbescheid'||b.typ==='vb')&&(b.zust||b.bdatum)?addD(b.zust||b.bdatum,14):'';
function todos(A){const st=ST().stichtag,out=[];
 for(const a of A){if(a.done||a.k==='verf'||a.k==='neu')continue;
  for(const x of a.cls){const b=x.b;if(b.done||x.c.k==='verf'||dOf(b)<st)continue;
   if(isGer(b))out.push({a,b,t:'gericht',frist:fristOf(b)});
   else if(x.c.k==='alt'&&b.rolle!=='behoerde')out.push({a,b,t:'mail',frist:''})}}
 return out.sort((x,y)=>(x.frist||'9999').localeCompare(y.frist||'9999'))}

 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);return true}

 rechnung:'Rechnung für eine Leistung. Entstanden vor der Eröffnung → Alt-Forderung, nicht selbst zahlen. Danach → selbst zahlen.',
 mahnung:'Der Absender fordert Geld. Bei einer Alt-Forderung weist du auf das Insolvenzverfahren hin und zahlst nicht.',
 mahnbescheid:'Das Mahngericht hat auf Antrag des Gläubigers einen Zahlungsbefehl erlassen, ohne die Forderung zu prüfen. Widerspruch ist innerhalb von 2 Wochen ab Zustellung möglich.',
 vb:'Vollstreckungsbescheid: Damit dürfte der Gläubiger vollstrecken. Einspruch innerhalb von 2 Wochen ab Zustellung.',
 pfaendung:'Jemand will Geld oder Sachen pfänden. Für Alt-Gläubiger ist das während der Insolvenz unzulässig – sofort die Kanzlei informieren.',
 klage:'Ein Gerichtsverfahren (Klage oder Termin). Durch die Insolvenz meist unterbrochen – trotzdem sofort die Kanzlei informieren und Fristen beachten.'};
 if(T[b.typ]&&b.typ!=='info')return T[b.typ];
 return({insogericht:'Schreiben deines Insolvenzgerichts. Genau lesen, Fristen beachten, Original aufheben.',verwalter:'Dein Insolvenzverwalter bzw. Treuhänder. Fragen und Aufforderungen von ihm zügig beantworten.',kanzlei:'Post deiner eigenen Kanzlei.',behoerde:'Schreiben einer Behörde – auf Fristen achten.',gv:'Der Gerichtsvollzieher vollstreckt für Gläubiger. Bei Alt-Forderungen sofort die Kanzlei informieren.'})[b.rolle]||'Information – meist ist nichts weiter zu tun.'}

/* Original aufheben oder vernichten? */
const mustKeep=b=>b.keep===true||(b.keep!==false&&(VERF.has(b.rolle)||b.rolle==='gericht'||b.rolle==='gv'||GT.has(b.typ)));

/* ---------- Erinnerungen ans Handy ---------- */
let remT=0;function remSync(){clearTimeout(remT);remT=setTimeout(remPush,1500)}
function remPush(){if(!AB||!KEY)return;try{if(!AB.setReminders)return}catch{return}
 const out=[],add=(key,d,t)=>{if(!d)return;for(const n of [3,0]){const at=addD(d,-n);out.push({id:key+':'+n,d:at,t:t+(n?` (in ${n} Tagen, ${fd(d)})`:` (heute, ${fd(d)})`)})}};
 const A=akten();for(const t of todos(A))if(t.frist)add('f'+t.b.id,t.frist,'Gerichtsfrist läuft ab');
 for(const a of A)if(!a.done&&a.offen>0)for(const x of a.cls)if((x.c.k==='neu'||x.c.k==='teil')&&x.b.faellig&&!x.b.done)add('z'+x.b.id,x.b.faellig,'Rechnung fällig');
 for(const v of ofKind('vertrag')){if(v.gekuendigt)continue;const d=kdl(v).bis;if(d){out.push({id:'v'+v.id+':14',d:addD(d,-14),t:'Kündigungsfrist endet am '+fd(d)});add('v'+v.id,d,'Kündigungsfrist endet')}}
 for(const w of ofKind('bewerbung'))if(w.status==='gesendet'&&w.gesendet)out.push({id:'b'+w.id,d:addD(w.gesendet,14),t:'Bewerbung nachfassen'});
 try{AB.setReminders(JSON.stringify(out.filter(x=>x.d>=addD(today(),-1))))}catch{}}

function vPkonto(){const L=ofKind('pkonto').sort((a,b)=>b.monat.localeCompare(a.monat)),s=ST();
 const row=p=>{const off=Math.max(0,(p.gesperrt||0)-(p.frei||0)),rest=(p.netto||0)-(p.abg||0)-off;return `<div class="card"><div class="hd2"><h3>${new Date(p.monat+'-01').toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3><button class="ghost" data-dp="${p.id}" aria-label="Löschen">✕</button></div>
  <dl class="kv"><dt>Nettolohn</dt><dd class="num">${eur(p.netto)}</dd><dt>An Verwalter abgeführt</dt><dd class="num">${eur(p.abg)}</dd><dt>Auf P-Konto gesperrt</dt><dd class="num">${eur(p.gesperrt)}</dd><dt>Davon freigegeben</dt><dd class="num">${eur(p.frei)}</dd><dt><b>Dir bleibt</b></dt><dd class="num"><b>${eur(rest)}</b></dd></dl>
  ${off>0?`<p class="frist">${eur(off)} noch gesperrt</p><button class="pri" data-fr="${p.id}">Freigabe beim Verwalter anfragen</button>`:''}${p.notiz?`<p class="note">${esc(p.notiz)}</p>`:''}</div>`};

 <form id="pk" class="card"><h3>Monat eintragen</h3><div class="grid2">${field('k_m','Monat',today().slice(0,7),'month')}${field('k_n','Nettolohn (€)','','text','inputmode="decimal"')}${field('k_a','An Verwalter abgeführt (€)','','text','inputmode="decimal"')}${field('k_g','Auf P-Konto gesperrt (€)','','text','inputmode="decimal"')}${field('k_f','Davon freigegeben (€)','','text','inputmode="decimal"')}${field('k_x','Notiz')}</div><div class="row"><button class="pri">Speichern</button></div>

  modal(`<h2>Freigabe anfragen</h2><textarea id="fr_t" rows="14"></textarea><div class="row"><a class="btn pri" id="fr_m" target="_blank" rel="noopener">E-Mail an Verwalter</a><button id="fr_c">Kopieren</button></div><p class="note">Bitte den Text prüfen und an deinen Fall anpassen.</p>`);

 const miss=A.filter(a=>!hit(a)),cnt=i=>A.filter(a=>(normAz(i.az)&&a.briefe.some(b=>normAz(b.az)===normAz(i.az)))||a.chain.some(c=>sameName(c.firma,i.name))).length;

 const s=ST(),gm=$('#gl_m');if(gm)gm.href=mailto(s.kanzleiMail,'',`Insolvenzverfahren ${s.insoAz}: Gläubiger nicht in der Liste`,`Sehr geehrte Damen und Herren,\n\nvon folgenden Absendern habe ich Post erhalten, die in meiner Gläubigerliste nicht aufgeführt sind:\n\n${miss.map(a=>`- ${a.glaeubiger}${a.aktuell&&a.aktuell!==a.glaeubiger?' (jetzt: '+a.aktuell+')':''}${a.az?', Zeichen '+a.az:''}${a.alt?', '+eur(a.alt):''}`).join('\n')}\n\nBitte prüfen Sie, ob diese nachgemeldet werden müssen.\n\nMit freundlichen Grüßen\n${s.name||''}`);

/* ---------- Verträge ---------- */
function kdl(v){if(v.gekuendigt)return{};const f=+v.frist||0;if(!v.ende)return{bis:'',zum:''};
 if(v.ende>today()){const bis=addM(v.ende,-f);if(bis>=today())return{bis,zum:v.ende}}
 const mon=v.verl==='monatlich'?1:v.verl==='12'?12:0;if(!mon)return{bis:'',zum:v.ende,abgelaufen:v.ende<=today()};
 let zum=v.ende;while(addM(zum,-(v.verl==='monatlich'?1:f))<today())zum=addM(zum,mon);return{bis:addM(zum,-(v.verl==='monatlich'?1:f)),zum}}
function vVertraege(){const L=ofKind('vertrag').sort((a,b)=>(kdl(a).bis||'9').localeCompare(kdl(b).bis||'9'));
 shell(`${back()}<h1 style="margin-top:12px">Verträge</h1>
 <div class="row" style="margin-bottom:8px"><button class="pri" id="v_new">+ Vertrag hinzufügen</button></div>
 ${L.map(v=>{const k=kdl(v);return `<div class="card"><div class="hd2"><h3>${esc(v.anbieter)}</h3>${v.gekuendigt?'<span class="badge b-verf">gekündigt</span>':''}</div>
  <dl class="kv">${v.art?`<dt>Art</dt><dd>${esc(v.art)}</dd>`:''}${v.nr?`<dt>Vertrags-Nr.</dt><dd>${esc(v.nr)}</dd>`:''}${v.kosten?`<dt>Kosten</dt><dd class="num">${eur(v.kosten)} / Monat</dd>`:''}${v.ende?`<dt>Laufzeit bis</dt><dd>${fd(v.ende)}</dd>`:''}

function bindMeter(p=''){$('#'+p+'n1').oninput=e=>{const v=strength(e.target.value);const m=$('#'+p+'mt');m.style.width=v*20+'%';m.style.background=v>=4?'var(--ok)':v>=3?'var(--warn)':'var(--alt)'}}
function checkNew(p=''){const a=$('#'+p+'n1').value,b=$('#'+p+'n2').value;if(a.length<12){toast('Mindestens 12 Zeichen');return null}if(a!==b){toast('Passwörter stimmen nicht überein');return null}if(strength(a)<3){toast('Bitte ein stärkeres Passwort (Groß/klein, Zahl oder Satz)');return null}return a}
async function rawFromPw(pw){const kp=await kdf(pw,unb64(META.salt),META.iter);return unseal(kp,META.wp)}
async function writeMeta(m){await serial(()=>B().set('meta','vault',m));META=m}
async function changePw(){modal(`<h2>Passwort ändern</h2><label for="o1">Aktuelles Passwort</label><input id="o1" type="password" autocomplete="current-password">${pwFields()}<div class="row"><button class="pri" id="go">Ändern</button></div>`);bindMeter();
 $('#go').onclick=async e=>{const nw=checkNew();if(!nw)return;busy(e.target,true,'Bitte warten …');try{const raw=await rawFromPw($('#o1').value);const salt=rnd(16);const wp=await seal(await kdf(nw,salt,ITER),raw);raw.fill(0);await writeMeta({...META,salt:b64(salt),iter:ITER,wp});closeModal();toast('Passwort geändert')}catch{toast('Aktuelles Passwort falsch');busy(e.target,false,'Ändern')}}}
async function regenCode(){modal(`<h2>Neuer Notfall-Code</h2><p class="note">Der alte Code wird ungültig.</p><label for="o1">Passwort</label><input id="o1" type="password" autocomplete="current-password"><div class="row"><button class="pri" id="go">Code erstellen</button></div>`);
 $('#go').onclick=async e=>{busy(e.target,true,'Bitte warten …');try{const raw=await rawFromPw($('#o1').value);const code=newCode(),saltR=rnd(16);const wr=await seal(await kdf(normCode(code),saltR,ITER),raw);raw.fill(0);await writeMeta({...META,saltR:b64(saltR),wr});modal(`<h2>Dein neuer Notfall-Code</h2><div class="code">${code}</div><p>Schreib ihn auf Papier und bewahre ihn getrennt vom Handy auf.</p>`)}catch{toast('Passwort falsch');busy(e.target,false,'Code erstellen')}}}
async function backupJson(){const ent=await B().list('entries'),bl=await B().list('blobs');return JSON.stringify({app:'papierkram-tresor',v:1,at:new Date().toISOString(),meta:META,entries:ent,blobs:bl})}
async function exportBackup(btn,how){const t=btn.textContent;busy(btn,true,'Sicherung wird erstellt …');try{const fn=`mein-daten-digitalisierer-sicherung-${today()}.json`,j=await backupJson();how==='share'?await share(fn,j):await save(fn,j);put({...ST(),lastBackup:today()})}catch(e){toast('Sicherung fehlgeschlagen: '+e.message,5000)}busy(btn,false,t)}
async function restore(j){for(const n of ['entries','blobs']){const ex=await B().list(n);for(const d of ex)await serial(()=>B().del(n,d.id))}
 for(const d of j.entries){const{id,...body}=d;await serial(()=>B().set('entries',id,body))}
 for(const d of j.blobs){const{id,...body}=d;await serial(()=>B().set('blobs',id,body))}
 await writeMeta(j.meta)}
async function importBackup(file){if(!file)return;let j;try{j=JSON.parse(await file.text())}catch{return toast('Keine gültige Sicherungsdatei')}
 if(j.app!=='papierkram-tresor'||!j.meta?.wp)return toast('Keine gültige Sicherungsdatei');
 if(!await ask(`Sicherung vom ${fd((j.at||'').slice(0,10))} einspielen? Alle aktuellen Daten werden ersetzt. Danach entsperrst du mit dem Passwort dieser Sicherung.`,'Ersetzen',true))return;
 toast('Wird eingespielt …',8000);try{await restore(j);bioOff();toast('Sicherung eingespielt');lock()}catch(e){toast('Fehler beim Einspielen: '+e.message,6000)}}
async function exportCsv(){if(!await ask('Die Gläubigerliste wird unverschlüsselt gespeichert. Fortfahren?','Ja, speichern'))return;
 const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const rows=[['Ursprünglicher Gläubiger','Aktuell bei','Aktenzeichen','Alt-Forderung (EUR)','Neu offen (EUR)','Letztes Schreiben','Einstufung','Status']];
 for(const a of akten().filter(a=>a.k!=='verf'))rows.push([a.glaeubiger,a.aktuell,a.az,a.alt.toFixed(2).replace('.',','),a.offen.toFixed(2).replace('.',','),fd(dOf(a.neuest)),KL[a.k],a.done?'erledigt':'offen']);
 await save(`glaeubigerliste-${today()}.csv`,'﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'))}

/* ---------- Einrichtung & Sperre ---------- */
function lockScreen(inner){app.innerHTML=`<div class="lockbox">${inner}</div>`}
function showSetup(){lockScreen(`<h1>Mein Daten-Digitalisierer einrichten</h1><p>Hier landen deine Rechnungen, Mahnungen und Gerichtsschreiben – sortiert nach Aktenzeichen und nach dem Eröffnungsdatum deiner Insolvenz.</p>
 <div class="banner">Dein Passwort ist der einzige Schlüssel. Niemand – auch nicht der Server – kann es zurücksetzen. Deshalb bekommst du gleich zusätzlich einen Notfall-Code für Papier.</div>
 <form id="su">${pwFields()}<div class="row"><button class="pri" id="sb">Zugang anlegen</button></div></form>`);bindMeter();
 $('#su').onsubmit=async e=>{e.preventDefault();const pw=checkNew();if(!pw)return;busy($('#sb'),true,'Schlüssel wird erzeugt …');
  try{const raw=rnd(32),salt=rnd(16),saltR=rnd(16),code=newCode();
   const wp=await seal(await kdf(pw,salt,ITER),raw),wr=await seal(await kdf(normCode(code),saltR,ITER),raw);
   KEY=await aesKey(raw);raw.fill(0);const meta={v:1,iter:ITER,salt:b64(salt),saltR:b64(saltR),wp,wr,chk:await seal(KEY,te.encode('ok')),created:new Date().toISOString()};bioOff();
   lockScreen(`<h1>Dein Notfall-Code</h1><div class="code">${code}</div><p>Schreib diesen Code <b>jetzt auf Papier</b> und leg ihn zu deinen wichtigen Unterlagen. Damit kommst du an deine Daten, falls du das Passwort vergisst. Mach kein Foto davon auf dem Handy.</p>
    <label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" id="ok" style="width:24px;min-height:24px"> Ich habe den Code aufgeschrieben</label><div class="row"><button class="pri" id="fin" disabled>Weiter</button></div>`);
   $('#ok').onchange=e=>{$('#fin').disabled=!e.target.checked};
   $('#fin').onclick=async e=>{busy(e.target,true,'Speichere …');try{await writeMeta(meta);E.clear();await put({...DEF,id:'settings'});armLock();go('mehr');toast('Die App ist eingerichtet – jetzt Verfahrensdaten eintragen',4500)}catch(err){toast('Speichern fehlgeschlagen: '+err.message,6000);busy(e.target,false,'Weiter')}}}
  catch(err){toast('Fehler: '+err.message);busy($('#sb'),false,'Zugang anlegen')}}}
/* ---------- Fingerabdruck (nur App) ---------- */
const bioWait=new Map();window.__bioDone=(id,r)=>{const f=bioWait.get(id);if(f){bioWait.delete(id);f(String(r||''))}};
const bioCall=(fn,...a)=>new Promise(res=>{const id=nid();bioWait.set(id,res);try{AB[fn](id,...a)}catch(e){bioWait.delete(id);res('FEHLER:'+e.message)}});
const bioOn=()=>{try{return!!AB&&AB.bioEnabled()}catch{return false}};
const bioCan=()=>{try{return!!AB&&AB.bioAvailable()}catch{return false}};
const bioOff=()=>{try{AB&&AB.bioDisable()}catch{}};
async function ensureChk(){if(!META.chk){try{await writeMeta({...META,chk:await seal(KEY,te.encode('ok'))})}catch{}}}
async function keyOk(){if(!META.chk)return true;try{return td.decode(await unseal(KEY,META.chk))==='ok'}catch{return false}}
async function bioEnableWith(raw){const r=await bioCall('bioEnable',b64(raw));raw.fill(0);if(r==='OK'){toast('Fingerabdruck ist eingerichtet');return true}if(r!=='CANCEL')toast('Einrichten nicht möglich: '+r.replace(/^FEHLER:/,''),5000);return false}
async function bioUnlock(){const r=await bioCall('bioUnlock');
 if(r.startsWith('OK:')){const raw=unb64(r.slice(3));KEY=await aesKey(raw);raw.fill(0);
  if(!await keyOk()){KEY=null;bioOff();return showLock('Der Fingerabdruck passt nicht mehr zu diesem Tresor. Bitte mit Passwort entsperren und neu einrichten.')}
  try{fails=0;await loadAll();armLock();go('home');takeShared()}catch(err){KEY=null;if(err.code==='auth')return cloudLogin();toast('Daten nicht erreichbar: '+err.message,5000)}}
 else if(r==='INVALID')showLock('Fingerabdrücke im Handy wurden geändert. Bitte einmal mit Passwort entsperren und den Fingerabdruck neu einrichten.');
 else if(r!=='CANCEL')toast('Fingerabdruck nicht möglich: '+r.replace(/^FEHLER:/,''),5000)}
function showLock(msg=''){KEY=null;E.clear();closeModal();
 lockScreen(`<h1>Mein Daten-Digitalisierer</h1>${msg?`<p class="note">${esc(msg)}</p>`:''}${bioOn()?'<div class="row" style="margin:0 0 8px"><button type="button" class="pri" id="bioB" style="flex:1">Mit Fingerabdruck entsperren</button></div><p class="note">oder mit Passwort:</p>':''}${!bioOn()&&bioCan()?'<p class="note">Nach dem Entsperren kannst du den Fingerabdruck einschalten (Einstellungen › Sicherheit).</p>':''}<form id="lf"><label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" ${bioOn()?'':'autofocus'}><div class="row"><button class="pri" id="ub">Entsperren</button><button type="button" class="ghost" id="rc">Passwort vergessen?</button></div></form>`);
 $('#lf').onsubmit=async e=>{e.preventDefault();if(Date.now()<blockUntil)return toast(`Zu viele Versuche – bitte ${Math.ceil((blockUntil-Date.now())/1000)} s warten`);busy($('#ub'),true,'Entschlüssele …');
  try{const raw=await rawFromPw($('#pw').value);KEY=await aesKey(raw);fails=0;await loadAll();await ensureChk();armLock();go('home');takeShared();
   if(bioCan()&&!bioOn()&&!LS.get('bioAsked2')){LS.set('bioAsked2','1');const copyRaw=raw.slice();raw.fill(0);
    if(await ask('Künftig mit Fingerabdruck entsperren? Dein Passwort bleibt trotzdem gültig.','Ja, einrichten'))await bioEnableWith(copyRaw);else copyRaw.fill(0)}else raw.fill(0)}
  catch(err){if(KEY){KEY=null;if(err.code==='auth')return cloudLogin();toast('Daten nicht erreichbar: '+err.message,5000)}else{fails++;if(fails>=5)blockUntil=Date.now()+30000*2**(fails-5);toast('Passwort falsch')}busy($('#ub'),false,'Entsperren')}};
 const bb=$('#bioB');if(bb){bb.onclick=bioUnlock;setTimeout(bioUnlock,250)}
 $('#rc').onclick=()=>{lockScreen(`<h1>Mit Notfall-Code entsperren</h1><form id="rf"><label for="cd">Notfall-Code</label><input id="cd" autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX">${pwFields()}<div class="row"><button class="pri" id="rb">Entsperren & neues Passwort setzen</button><button type="button" class="ghost" id="bk2">Zurück</button></div></form>`);bindMeter();
  $('#bk2').onclick=()=>showLock();
  $('#rf').onsubmit=async e=>{e.preventDefault();const nw=checkNew();if(!nw)return;busy($('#rb'),true,'Prüfe …');
   try{const raw=await unseal(await kdf(normCode($('#cd').value),unb64(META.saltR),META.iter),META.wr);const salt=rnd(16);const wp=await seal(await kdf(nw,salt,ITER),raw);KEY=await aesKey(raw);raw.fill(0);await writeMeta({...META,salt:b64(salt),iter:ITER,wp});await loadAll();armLock();go('home');takeShared();toast('Neues Passwort gesetzt')}
   catch{KEY=null;toast('Code falsch oder keine Verbindung');busy($('#rb'),false,'Entsperren & neues Passwort setzen')}}}}
function lock(){showLock('Gesperrt. Deine Daten sind verschlüsselt.')}
let armed=false;function armLock(){lastAct=Date.now();if(armed)return;armed=true;
 ['pointerdown','keydown','scroll','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},{passive:true}));
 setInterval(()=>{if(KEY&&Date.now()-lastAct>(+ST().lockMin||5)*6e4)showLock('Automatisch gesperrt nach Inaktivität.')},15000);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(KEY&&hiddenAt&&Date.now()-hiddenAt>6e4)showLock('Gesperrt, weil die App im Hintergrund war.')})}

/* ---------- Start: Speicherort, Cloud-Anmeldung ---------- */
function offline(e){lockScreen(`<h1>Mein Daten-Digitalisierer</h1><p>Der Speicher ist gerade nicht erreichbar${mode()==='cloud'?' – bitte Internetverbindung prüfen':''}.</p><p class="note">${esc(e?.message||'')}</p><div class="row"><button class="pri" id="rt">Erneut versuchen</button></div>`);$('#rt').onclick=()=>{lockScreen('<p class="note">Verbinde …</p>');boot()}}
function chooseStore(){lockScreen(`<h1>Mein Daten-Digitalisierer</h1><p>Wo sollen deine Daten liegen? Verschlüsselt werden sie in beiden Fällen auf deinem Gerät.</p>
 <div class="card"><h3>Cloud (Supabase) – empfohlen</h3><p class="note">Am PC abrufbar und bei Handyverlust nicht weg. Einmalig ein kostenloses Supabase-Konto nötig (Anleitung im GitHub-Repository).</p><button class="pri" id="cs1">Cloud verbinden</button></div>
 <div class="card"><h3>Erst mal nur auf diesem Gerät</h3><p class="note">Sofort startklar. Später jederzeit in die Cloud umziehbar.</p><button id="cs2">Nur hier speichern</button></div>`);
 $('#cs1').onclick=()=>cloudSetup();$('#cs2').onclick=()=>{LS.set('mode','local');boot()}}
async function migrate(){lockScreen('<h1>Umzug in die Cloud</h1><p id="mg">Prüfe …</p>');const st=t=>{$('#mg').textContent=t};
 if(await Cloud.get('meta','vault')){lockScreen('<h1>Umzug abgebrochen</h1><p>In diesem Cloud-Konto liegen schon Daten. Damit nichts überschrieben wird, habe ich nichts übertragen.</p><div class="row"><button class="pri" id="bk3">Zurück</button></div>');$('#bk3').onclick=()=>KEY?go('mehr'):boot();return}
 const meta=await Local.get('meta','vault'),ent=await Local.list('entries'),bl=await Local.list('blobs');let n=0;const tot=ent.length+bl.length;
 for(const d of ent){const{id,...body}=d;await Cloud.set('entries',id,body);st(`Übertrage ${++n} von ${tot} …`)}
 for(const d of bl){const{id,...body}=d;await Cloud.set('blobs',id,body);st(`Übertrage ${++n} von ${tot} …`)}
 await Cloud.set('meta','vault',meta);LS.set('mode','cloud');toast('Umzug fertig – deine Daten liegen jetzt verschlüsselt in der Cloud',5000);KEY?go('mehr'):boot()}
function cloudSetup(mig=false){lockScreen(`<h1>Cloud verbinden</h1><p class="note">URL und Schlüssel findest du in Supabase unter <b>Project Settings › API</b>. Das Konto legst du dort unter <b>Authentication › Users</b> an.</p>
 <form id="cf"><label for="c_url">Project URL</label><input id="c_url" placeholder="https://xxxx.supabase.co" value="${esc(LS.get('sb_url')||'')}" autocomplete="off" inputmode="url">
 <label for="c_key">anon public key</label><input id="c_key" value="${esc(LS.get('sb_key')||'')}" autocomplete="off">
 <label for="c_mail">Konto-E-Mail</label><input id="c_mail" type="email" value="${esc(LS.get('sb_email')||'')}" autocomplete="username">
 <label for="c_pw">Konto-Passwort</label><input id="c_pw" type="password" autocomplete="current-password">
 <div class="row"><button class="pri" id="cb">Verbinden</button><button type="button" class="ghost" id="cx">Zurück</button></div></form>`);
 $('#cx').onclick=()=>mig&&KEY?go('mehr'):(mode()?boot():chooseStore());
 $('#cf').onsubmit=async e=>{e.preventDefault();const url=$('#c_url').value.trim(),key=$('#c_key').value.trim();if(!/^https:\/\/.+/.test(url)||key.length<20)return toast('Bitte URL (https://…) und Schlüssel prüfen');
  busy($('#cb'),true,'Verbinde …');LS.set('sb_url',url);LS.set('sb_key',key);Cloud.cfg();
  try{await Cloud.login($('#c_mail').value.trim(),$('#c_pw').value);await Cloud.list('meta')}catch(err){toast(/relation|vault_docs|schema/i.test(err.message)?'Tabelle fehlt – bitte zuerst das SQL aus der Anleitung in Supabase ausführen':err.message,6000);busy($('#cb'),false,'Verbinden');return}
  if(mig){try{await migrate()}catch(err){toast('Umzug fehlgeschlagen: '+err.message,6000);KEY?go('mehr'):boot()}}else{LS.set('mode','cloud');boot()}}}
function cloudLogin(){lockScreen(`<h1>Anmelden</h1><p class="note">Melde dich mit deinem Cloud-Konto an. Danach brauchst du auf diesem Gerät nur noch dein Tresor-Passwort.</p>
 <form id="cl"><label for="l_mail">Konto-E-Mail</label><input id="l_mail" type="email" value="${esc(LS.get('sb_email')||'')}" autocomplete="username"><label for="l_pw">Konto-Passwort</label><input id="l_pw" type="password" autocomplete="current-password">
 <div class="row"><button class="pri" id="lb">Anmelden</button><button type="button" class="ghost" id="lc">Verbindung ändern</button></div></form>`);
 $('#lc').onclick=()=>cloudSetup();
 $('#cl').onsubmit=async e=>{e.preventDefault();busy($('#lb'),true,'Melde an …');try{await Cloud.login($('#l_mail').value.trim(),$('#l_pw').value);boot()}catch(err){toast(err.message,5000);busy($('#lb'),false,'Anmelden')}}}
async function boot(){
 if(!window.crypto?.subtle)return lockScreen('<h1>Mein Daten-Digitalisierer</h1><p>Dieser Browser unterstützt die nötige Verschlüsselung nicht.</p>');
 const m=mode();if(!m)return chooseStore();
 if(m==='cloud'){if(!Cloud.cfg())return cloudSetup();try{await Cloud.token()}catch(e){return e.code==='auth'?cloudLogin():offline(e)}}
 try{META=(await B().get('meta','vault'))||null;META?.wp?showLock():showSetup()}catch(e){e.code==='auth'?cloudLogin():offline(e)}}
window.appBack=()=>{if($('#modal').innerHTML){closeModal();return true}if(KEY&&view.v!=='home'){go(view.v==='akte'?'akten':HUBV.includes(view.v)&&view.v!=='hub'?'hub':'home');return true}return false};
setTimeout(boot,0);
}
</script>
